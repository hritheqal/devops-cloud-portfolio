<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A starter page for the DevOps Cloud Portfolio.">
    <title>DevOps Cloud Portfolio</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #172033;
        background: #f3f6fb;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        max-width: 36rem;
        margin: 1.5rem;
        padding: 2.5rem;
        border: 1px solid #dce3ee;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 1rem 2.5rem rgb(23 32 51 / 8%);
      }

      h1 {
        margin-top: 0;
      }

      p {
        line-height: 1.6;
        color: #526078;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>DevOps Cloud Portfolio</h1>
      <p>Your Express app is up and running. Start building your portfolio here.</p>
    </main>
  </body>
</html>
